[package]
name = "pill"
version = "0.2.0"
edition = "2021"

[dependencies]
# Нужен макросу #[implement] (свои COM-колбэки).
windows-core = "0.58"

[dependencies.windows]
version = "0.58"
features = [
    # WinRT: музыка, обложки, радио (Wi-Fi / Bluetooth)
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Graphics_Imaging",
    "Devices_Radios",
    # Имя сети Wi-Fi для плитки в «Управлении»
    "Networking_Connectivity",
    # Чужие уведомления (тосты Telegram и других программ) для вкладки «События»
    "ApplicationModel",
    "UI_Notifications",
    "UI_Notifications_Management",
    # Тёмный заголовок окна настроек (DwmSetWindowAttribute)
    "Win32_Graphics_Dwm",
    # Свои COM-колбэки (события громкости)
    "implement",
    # Win32
    "Win32_Foundation",
    # Монитор системы: список процессов ядра одним вызовом (NtQuerySystemInformation)
    "Wdk_System_SystemInformation",
    # Монитор системы: загрузка видеокарты по движкам (D3DKMTQueryStatistics, как диспетчер задач)
    "Wdk_Graphics_Direct3D",
    # Монитор системы: сеть (GetIfTable2), место и активность дисков (IOCTL_DISK_PERFORMANCE)
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    # Яркость монитора ПК по DDC/CI (dxva2)
    "Win32_Devices_Display",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_NetworkManagement_Rras",
    "Win32_Security",
    # Ключ локального API: случайные байты системного генератора (BCryptGenRandom)
    "Win32_Security_Cryptography",
    "Win32_System_Com",
    # STGMEDIUM для приёма файлов (CF_HDROP)
    "Win32_System_Com_StructuredStorage",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_Debug",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Power",
    "Win32_System_Registry",
    # RPC_C_AUTHN_WINNT для WMI-подключения
    "Win32_System_Rpc",
    # GUID-ы событий питания: зарядка, процент батареи, яркость ноутбука
    "Win32_System_SystemServices",
    "Win32_System_Shutdown",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    # Яркость встроенного экрана ноутбука (ROOT\WMI, только из фонового потока)
    "Win32_System_Wmi",
    # Смена активного окна (SetWinEventHook): чёлка снова встаёт поверх
    "Win32_UI_Accessibility",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
    "Win32_UI_WindowsAndMessaging",
]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
